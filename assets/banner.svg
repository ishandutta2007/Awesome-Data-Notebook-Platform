<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 300"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#311042"/></linearGradient><linearGradient id="titleGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff" stop-opacity=".07"/><stop offset="100%" stop-color="#fff" stop-opacity=".02"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes pulse{0%{transform:scale(1) translate(0,0);opacity:.3}}@keyframes float{0%{transform:translateY(0)}}.pulse-circle{animation:pulse 4s ease-in-out infinite alternate}.float-card{animation:float 6s ease-in-out infinite alternate}.dash-flow{stroke-dasharray:10,15;animation:dash 20s linear infinite}</style></defs><rect width="1200" height="300" fill="url(#bgGrad)" rx="16"/><circle cx="150" cy="80" r="160" fill="#6366f1" class="pulse-circle" filter="url(#glow)" opacity=".25"/><circle cx="1050" cy="220" r="180" fill="#a855f7" class="pulse-circle" filter="url(#glow)" opacity=".25"/><path fill="none" stroke="#38bdf8" stroke-width="2" d="M 50,220 Q 300,280 600,220 T 1150,150" class="dash-flow" opacity=".4"/><path fill="none" stroke="#818cf8" stroke-width="2" d="M 100,50 Q 400,10 700,90 T 1100,60" class="dash-flow" opacity=".3"/><g class="float-card" transform="translate(920, 45)"><rect width="220" height="110" fill="url(#cardGrad)" stroke="#818cf8" stroke-opacity=".3" stroke-width="1.5" rx="12"/><rect width="60" height="8" x="15" y="18" fill="#38bdf8" opacity=".8" rx="4"/><rect width="110" hei