<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .pulse-circle {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      .float-card {
        animation: float 6s ease-in-out infinite alternate;
      }
      .dash-flow {
        stroke-dasharray: 10, 15;
        animation: dash 20s linear infinite;
      }
      @keyframes pulse {
        0% { transform: scale(1) translate(0, 0); opacity: 0.3; }
        100% { transform: scale(1.15) translate(-20px, 15px); opacity: 0.6; }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-12px); }
      }
      @keyframes dash {
        to { stroke-dashoffset: -1000; }
      }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Dynamic Glowing Background Elements -->
  <circle cx="150" cy="80" r="160" fill="#6366f1" filter="url(#glow)" class="pulse-circle" opacity="0.25"/>
  <circle cx="1050" cy="220" r="180" fill="#a855f7" filter="url(#glow)" class="pulse-circle" opacity="0.25"/>

  <!-- Animated Data Connection Lines -->
  <path d="M 50,220 Q 300,280 600,220 T 1150,150" fill="none" stroke="#38bdf8" stroke-width="2" class="dash-flow" opacity="0.4"/>
  <path d="M 100,50 Q 400,10 700,90 T 1100,60" fill="none" stroke="#818cf8" stroke-width="2" class="dash-flow" opacity="0.3"/>

  <!-- Ambient Dynamic Graphic / Graph Pill Overlay -->
  <g transform="translate(920, 45)" class="float-card">
    <rect width="220" height="110" rx="12" fill="url(#cardGrad)" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1.5"/>
    <rect x="15" y="18" width="60" height="8" rx="4" fill="#38bdf8" opacity="0.8"/>
    <rect x="85" y="18" width="110" height="8" rx="4" fill="#64748b" opacity="0.5"/>
    <rect x="15" y="38" width="180" height="6" rx="3" fill="#94a3b8" opacity="0.3"/>
    <rect x="15" y="52" width="140" height="6" rx="3" fill="#94a3b8" opacity="0.3"/>
    <rect x="20" y="75" width="14" height="20" rx="2" fill="#818cf8"/>
    <rect x="42" y="68" width="14" height="27" rx="2" fill="#38bdf8"/>
    <rect x="64" y="80" width="14" height="15" rx="2" fill="#c084fc"/>
    <rect x="86" y="60" width="14" height="35" rx="2" fill="#4ade80"/>
  </g>

  <g transform="translate(60, 185)" class="float-card" style="animation-delay: -3s;">
    <rect width="180" height="80" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="15" y="30" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">⚡ Reactive Kernel</text>
    <rect x="15" y="45" width="120" height="6" rx="3" fill="#38bdf8" opacity="0.7"/>
    <rect x="15" y="58" width="80" height="6" rx="3" fill="#a855f7" opacity="0.7"/>
  </g>

  <!-- Foreground Title and Subtitle -->
  <g transform="translate(60, 115)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="url(#titleGrad)" letter-spacing="-0.5">
      Awesome Data Notebook Platform
    </text>
    
    <text x="0" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Curated Ecosystem of SaaS &amp; Open-Source Data Workspaces, Reactive Notebooks &amp; BI Canvases
    </text>
  </g>
</svg>
